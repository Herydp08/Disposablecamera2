<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0b0a;
    --panel: #161412;
    --border: #292420;
    --ink: #f4ecdf;
    --muted: #8c8275;
    --accent: #ff6b35;
    --accent-glow: rgba(255, 107, 53, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: 'Space Mono', monospace; }

  .app {
    max-width: 440px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 6px;
  }
  .brand h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 19px;
    color: var(--ink);
  }
  .brand p {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-top: 1px;
  }
  .date-badge {
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 1px;
  }

  .camera-box {
    background: var(--panel);
    border-radius: 28px;
    padding: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .viewfinder {
    position: relative;
    aspect-ratio: 3/4;
    border-radius: 20px;
    overflow: hidden;
    background: #000;
    border: 2px solid var(--border);
  }

  video, #preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #preview { position: absolute; inset: 0; display: none; }

  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.22; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence baseFrequency='.8' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.7'/></svg>");
  }
  .flash {
    position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .flash.on { opacity: 1; transition: none; }

  .lens-switcher {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    background: rgba(12, 11, 10, 0.75);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 4px 8px;
    border-radius: 99px;
    gap: 6px;
    z-index: 3;
  }
  .lens-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lens-btn.active {
    background: var(--ink);
    color: #0c0b0a;
    font-weight: 700;
  }

  .control-panel {
    background: #11100e;
    border-radius: 20px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid var(--border);
  }

  .btn-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .btn-icon:active { transform: scale(0.92); }
  .btn-icon.active-flash { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

  .counter-badge {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: default;
  }
  .counter-num { font-size: 15px; font-weight: 700; color: var(--accent); line-height: 1; }
  .counter-lbl { font-size: 8px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

  .shutter-main {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 3px solid #2e2621;
    background: radial-gradient(circle at 35% 30%, #ff8a55, var(--accent) 60%, #b84102);
    box-shadow: 0 5px 0 #6e2501, 0 8px 20px var(--accent-glow);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .shutter-main:active { transform: translateY(3px); box-shadow: 0 2px 0 #6e2501; }

  .actions { display: none; gap: 10px; }
  .actions button {
    flex: 1; padding: 13px; border-radius: 14px; border: none; font: inherit; font-weight: 700; font-size: 12px; text-transform: uppercase; cursor: pointer;
  }
  .retake { background: var(--panel); color: var(--muted); border: 1px solid var(--border); }
  .save { background: var(--accent); color: #fff; box-shadow: 0 4px 15px var(--accent-glow); }

  .status { text-align: center; font-size: 11px; color: var(--muted); min-height: 16px; }

  .modal {
    position: fixed; inset: 0; background: rgba(12,11,10,0.9); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 9;
  }
  .card {
    background: var(--panel); padding: 24px; border-radius: 24px; width: 100%; max-width: 340px; text-align: center; border: 1px solid var(--border);
  }
  .card h2 { font-family: 'Fraunces', serif; font-style: italic; font-size: 22px; margin-bottom: 6px; }
  .card p { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
  .card input {
    width: 100%; margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: #0c0b0a; color: var(--ink); font: inherit; outline: none;
  }
  .card button {
    width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 15px var(--accent-glow);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h2>Our Day's</h2>
      <p>Disposable Camera</p>
    </div>
    <div class="date-badge" id="liveDate">11 07 '26</div>
  </header>

  <div class="camera-box">
    <div class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <img id="preview" alt="preview">
      <div class="grain" id="grain"></div>
      <div class="flash" id="flash"></div>

      <div class="lens-switcher" id="filters"></div>
    </div>

    <div class="control-panel" id="controls">
      <button class="btn-icon" id="flashBtn" title="Senter / Flash">⚡</button>
      
      <div class="counter-badge" title="Sisa Jepretan">
        <span class="counter-num" id="counterNum">--</span>
        <span class="counter-lbl">Sisa</span>
      </div>

      <button class="shutter-main" id="shutter" title="Jepret Foto"></button>

      <button class="btn-icon" id="flipBtn" title="Putar Kamera">⟲</button>
      
      <a class="btn-icon" href="gallery.html" style="text-decoration:none;" title="Galeri">▦</a>
    </div>

    <div class="actions" id="actions">
      <button class="retake" id="retake">Ulangi</button>
      <button class="save" id="save">Simpan & Upload</button>
    </div>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="modal" id="nameModal" style="display:none">
  <div class="card">
    <h2>Momen Spesial</h2>
    <p>Silakan masukkan nama kamu sebelum mulai mengabadikan momen 📸</p>
    <input id="nameInput" placeholder="Nama / Panggilan kamu" maxlength="40">
    <button id="nameBtn">Mulai Masuk Kamera</button>
  </div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
const API_URL = "MASUKKAN_URL_WEB_APP_APPS_SCRIPT_ANDA_DISINI";

const CFG = {
  max: 15,
  cloud: "rfth8pyv",
  preset: "disposable-camera"
};

const FILTERS = {
  normal:  { label:'1×',   css:'none', grain:0.15 },
  vintage: { label:'90s',  css:'sepia(0.3) saturate(1.4) contrast(1.1)', grain:0.25 },
  cyber:   { label:'Warm', css:'contrast(1.2) saturate(1.4) hue-rotate(-10deg)', grain:0.2 },
  bw:      { label:'Mono', css:'grayscale(1) contrast(1.35)', grain:0.35 }
};

const $ = id => document.getElementById(id);
let current = 'normal', facing = 'environment', stream = null, blob = null, used = 0, busy = false, torchOn = false;

let guestId = localStorage.getItem('ddc_gid');
if (!guestId) { 
  guestId = 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); 
  localStorage.setItem('ddc_gid', guestId); 
}
let guestName = localStorage.getItem('ddc_name');

function updateCounter(){
  const rem = Math.max(0, CFG.max - used);
  $('counterNum').textContent = rem;
  $('shutter').disabled = rem <= 0;
}
function status(t){ $('status').textContent = t; }

Object.entries(FILTERS).forEach(([k,f])=>{
  const b = document.createElement('button');
  b.className = 'lens-btn' + (k === current ? ' active' : '');
  b.textContent = f.label; 
  b.dataset.k = k;
  b.onclick = ()=>{ 
    current = k; 
    document.querySelectorAll('.lens-btn').forEach(x=>x.classList.toggle('active', x.dataset.k === k)); 
    applyFilter(); 
  };
  $('filters').appendChild(b);
});

function applyFilter(){
  $('video').style.filter = FILTERS[current].css;
  $('grain').style.opacity = FILTERS[current].grain;
}

async function startCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: { ideal: facing } }, 
      audio: false 
    });
    const videoElement = $('video');
    videoElement.srcObject = stream;
    await videoElement.play();
    videoElement.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
    status('');
  } catch(e) {
    status('Gagal membuka kamera. Izinkan akses kamera di browser.');
    console.error("Camera error:", e);
  }
}

$('flipBtn').onclick = ()=>{ 
  facing = facing === 'user' ? 'environment' : 'user'; 
  torchOn = false;
  $('flashBtn').classList.remove('active-flash');
  startCamera(); 
};

$('flashBtn').onclick = async () => {
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  const capabilities = track.getCapabilities ? track.getCapabilities() : {};
  if (!capabilities.torch) {
    alert('Perangkat ini tidak mendukung lampu flash fisik.');
    return;
  }
  try {
    torchOn = !torchOn;
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    $('flashBtn').classList.toggle('active-flash', torchOn);
  } catch (err) {
    status('Gagal menyalakan flash.');
  }
};

function playShutterSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(120, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.08);
  } catch(e) {}
}

$('shutter').onclick = ()=>{
  if (used >= CFG.max) return;
  const v = $('video'); 
  if (!v.videoWidth) return;
  
  playShutterSound();
  $('flash').classList.add('on'); 
  setTimeout(()=>$('flash').classList.remove('on'), 80);
  
  const c = $('canvas'), ctx = c.getContext('2d');
  const w = v.videoWidth, h = v.videoHeight;
  const sz = Math.min(w, h);
  c.width = 1000; c.height = 1000;
  
  ctx.save();
  if (facing === 'user'){ ctx.translate(c.width, 0); ctx.scale(-1, 1); }
  ctx.filter = FILTERS[current].css;
  ctx.drawImage(v, (w-sz)/2, (h-sz)/2, sz, sz, 0, 0, c.width, c.height);
  ctx.restore(); 
  ctx.filter = 'none';
  
  const d = new Date();
  const t = "'" + String(d.getFullYear()).slice(2) + ' ' + (d.getMonth()+1) + ' ' + d.getDate();
  ctx.font = 'bold 42px "Space Mono", monospace'; 
  ctx.fillStyle = '#ff7b3d';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 4;
  ctx.textAlign = 'right'; 
  ctx.fillText(t, w-40, h-40);
  
  c.toBlob(b=>{ 
    blob = b; 
    $('preview').src = URL.createObjectURL(b); 
    $('preview').style.display = 'block';
    $('controls').style.display = 'none'; 
    $('actions').style.display = 'flex'; 
    $('filters').style.display = 'none'; 
  }, 'image/jpeg', 0.92);
};

function resetView(){
  blob = null; 
  $('preview').style.display = 'none';
  $('controls').style.display = 'flex'; 
  $('actions').style.display = 'none'; 
  $('filters').style.display = 'flex';
}
$('retake').onclick = resetView;

$('save').onclick = async ()=>{
  if (!blob || busy) return; 
  busy = true; 
  $('save').disabled = true; 
  status('Mengunggah foto...');
  
  try {
    const fd = new FormData();
    fd.append('file', blob); 
    fd.append('upload_preset', CFG.preset);
    fd.append('folder', 'disposable-camera'); 
    fd.append('tags', guestId);
    
    const r = await fetch('https://api.cloudinary.com/v1_1/' + CFG.cloud + '/image/upload', { 
      method: 'POST', 
      body: fd 
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error ? j.error.message : 'Gagal upload ke Cloudinary');
    
    const queryParams = new URLSearchParams({
      action: 'save',
      guestId: guestId,
      guestName: guestName,
      filter: current,
      imageUrl: j.secure_url,
      publicId: j.public_id,
      width: j.width,
      height: j.height
    });

    await fetch(API_URL + '?' + queryParams.toString(), { method: 'GET', mode: 'no-cors' });
    
    busy = false; 
    $('save').disabled = false;
    used++; 
    localStorage.setItem('ddc_used', used); 
    updateCounter(); 
    resetView();
    status('Tersimpan ke galeri! ✓');
  } catch(e){ 
    busy = false; 
    $('save').disabled = false; 
    status('Error: ' + e.message); 
  }
};

used = Number(localStorage.getItem('ddc_used') || 0); 
updateCounter(); 
applyFilter();

if (!guestName){ 
  $('nameModal').style.display = 'flex'; 
}

// PERBAIKAN: Penulisan syntax event listener sudah diperbaiki dengan benar
$('nameBtn').onclick = ()=>{ 
  guestName = $('nameInput').value.trim() || 'Tamu Kehormatan'; 
  localStorage.setItem('ddc_name', guestName); 
  $('nameModal').style.display = 'none'; 
  startCamera();
};

if (guestName) {
  startCamera();
}
</script>
</body>
</html>
