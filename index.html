<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Virtual Photobooth</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .serif { font-family: 'Playfair Display', serif; }
  .frame-card.selected { outline: 3px solid #b8935a; outline-offset: 2px; }
  #video.mirror { transform: scaleX(-1); }
</style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">

<!-- ====================== KONFIGURASI (WAJIB DIISI) ====================== -->
<script>
const CONFIG = {
  eventTitle:  'The Our Momment',
  eventDate:   '23 . 12 . 2026',
  cloudName:   'rfth8pyv',
  uploadPreset:'photobooth_unsigned',
  gasUrl:      'https://script.google.com/macros/s/AKfycbw8cTul4WAhck9B0hZou6GD4eLIdm6Rs-LmOIZzCl6vC8RWDDRwak05KyyqQojtw9zhPg/exec',
  maxShots: 15,   // batas jepretan per tamu (per perangkat)
  canvasW: 1080,
  canvasH: 1920
};

/* Daftar frame. Dua jenis:
   - { src: 'frames/nama.png' }  -> PNG transparan 1080x1920 buatan Anda
   - { draw: function(ctx,w,h) } -> frame digambar otomatis (bawaan)        */
const FRAMES = [
  { id: 'gold', name: 'Elegant Gold', draw: function (c, w, h) { drawGold(c, w, h); } },
  { id: 'blush', name: 'Blush Floral', draw: function (c, w, h) { drawBlush(c, w, h); } },
  { id: 'noir', name: 'Classic Noir', draw: function (c, w, h) { drawNoir(c, w, h); } }
  // Contoh frame PNG sendiri: { id:'custom1', name:'Frame Saya', src:'frames/frame1.png' }
];
</script>

<!-- ====================== HEADER ====================== -->
<header class="bg-white border-b border-stone-200 sticky top-0 z-30">
  <div class="max-w-md mx-auto px-4 pt-4 pb-2 text-center">
    <h1 id="title" class="serif text-2xl font-bold text-stone-800"></h1>
    <p id="date" class="text-xs tracking-widest text-amber-700 mt-1"></p>
  </div>
  <nav class="max-w-md mx-auto grid grid-cols-2 text-sm font-semibold">
    <button id="tabPhoto" class="py-3 border-b-2 border-amber-700 text-amber-800">Ambil Foto</button>
    <button id="tabGallery" class="py-3 border-b-2 border-transparent text-stone-500">Galeri Tamu</button>
  </nav>
</header>

<main class="max-w-md mx-auto px-4 py-5">

  <!-- ============ HALAMAN FOTO ============ -->
  <section id="pagePhoto">

    <!-- Step 1: Pilih frame -->
    <div id="step1">
      <h2 class="font-semibold mb-1">1. Pilih Bingkai</h2>
      <p class="text-sm text-stone-500 mb-3">Ketuk salah satu bingkai, lalu mulai kamera.</p>
      <div id="frameList" class="grid grid-cols-3 gap-3"></div>
      <button id="btnStartCam" class="mt-5 w-full bg-amber-700 text-white py-3 rounded-xl font-semibold shadow active:scale-95 transition disabled:opacity-40" disabled>
        Buka Kamera
      </button>
      <p id="shotInfo1" class="text-xs text-stone-500 text-center mt-2"></p>
    </div>

    <!-- Step 2: Kamera -->
    <div id="step2" class="hidden">
      <h2 class="font-semibold mb-3">2. Jepret Foto</h2>
      <div class="relative w-full mx-auto bg-black rounded-2xl overflow-hidden shadow-lg" style="aspect-ratio:9/16;">
        <video id="video" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline muted></video>
        <img id="liveFrame" class="absolute inset-0 w-full h-full pointer-events-none" alt="" />
        <div id="countdown" class="absolute inset-0 hidden items-center justify-center text-white text-8xl font-bold" style="text-shadow:0 2px 20px rgba(0,0,0,.6)"></div>
      </div>
      <div class="flex gap-3 mt-4">
        <button id="btnBack1" class="flex-1 bg-stone-200 py-3 rounded-xl font-semibold">Kembali</button>
        <button id="btnFlip" class="flex-1 bg-stone-800 text-white py-3 rounded-xl font-semibold active:scale-95 transition">Putar Kamera</button>
        <button id="btnSnap" class="flex-[2] bg-amber-700 text-white py-3 rounded-xl font-semibold shadow active:scale-95 transition">Jepret (3 dtk)</button>
      </div>
      <p id="shotInfo" class="text-xs text-stone-500 text-center mt-3"></p>
      <p id="camError" class="text-sm text-red-600 mt-3 hidden"></p>
    </div>

    <!-- Step 3: Preview + form -->
    <div id="step3" class="hidden">
      <h2 class="font-semibold mb-3">3. Hasil & Pesan Ucapan</h2>
      <img id="preview" class="w-full rounded-2xl shadow-lg bg-stone-200" style="aspect-ratio:9/16;" alt="Hasil foto" />
      <div class="mt-4 space-y-3">
        <input id="inpNama" maxlength="100" placeholder="Nama Anda" class="w-full border border-stone-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-600" />
        <textarea id="inpUcapan" rows="3" maxlength="500" placeholder="Pesan & ucapan untuk mempelai" class="w-full border border-stone-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-600"></textarea>
      </div>
      <div class="flex gap-3 mt-4">
        <button id="btnRetake" class="flex-1 bg-stone-200 py-3 rounded-xl font-semibold">Ulangi</button>
        <button id="btnUpload" class="flex-[2] bg-amber-700 text-white py-3 rounded-xl font-semibold shadow active:scale-95 transition disabled:opacity-50">Simpan & Unggah</button>
      </div>
      <p id="uploadMsg" class="text-sm mt-3 text-center"></p>
    </div>

    <!-- Step 4: Selesai -->
    <div id="step4" class="hidden text-center">
      <h2 class="serif text-2xl font-bold mb-2">Terima kasih!</h2>
      <p class="text-stone-500 text-sm mb-4">Foto Anda sudah tersimpan dan tampil di galeri.</p>
      <img id="donePreview" class="w-2/3 mx-auto rounded-2xl shadow-lg" alt="" />
      <div class="flex gap-3 mt-5">
        <button id="btnDownload" class="flex-1 bg-amber-700 text-white py-3 rounded-xl font-semibold">Unduh Foto</button>
        <button id="btnAgain" class="flex-1 bg-stone-200 py-3 rounded-xl font-semibold">Foto Lagi</button>
      </div>
      <button id="btnToGallery" class="mt-3 w-full text-amber-800 font-semibold py-2">Lihat Galeri →</button>
    </div>
  </section>

  <!-- ============ HALAMAN GALERI ============ -->
  <section id="pageGallery" class="hidden">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold">Galeri Tamu</h2>
      <button id="btnRefresh" class="text-sm text-amber-800 font-semibold">Muat ulang</button>
    </div>
    <p id="galleryMsg" class="text-sm text-stone-500 text-center py-8">Memuat...</p>
    <div id="galleryGrid" class="grid grid-cols-2 gap-3"></div>
  </section>
</main>

<!-- Modal galeri -->
<div id="modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-sm w-full max-h-[92vh] overflow-auto">
    <img id="modalImg" class="w-full rounded-t-2xl" alt="" />
    <div class="p-4">
      <p id="modalName" class="font-semibold"></p>
      <p id="modalMsg" class="text-sm text-stone-600 mt-1"></p>
      <div class="flex gap-3 mt-4">
        <a id="modalDownload" class="flex-1 text-center bg-amber-700 text-white py-3 rounded-xl font-semibold" target="_blank" rel="noopener">Unduh Resolusi Penuh</a>
        <button id="modalClose" class="flex-1 bg-stone-200 py-3 rounded-xl font-semibold">Tutup</button>
      </div>
    </div>
  </div>
</div>

<canvas id="work" class="hidden"></canvas>

<script>
/* ====================== FRAME GENERATOR (bawaan) ====================== */
function drawGold(ctx, w, h) {
  ctx.lineWidth = 36; ctx.strokeStyle = '#b8935a';
  ctx.strokeRect(18, 18, w - 36, h - 36);
  ctx.lineWidth = 6; ctx.strokeStyle = '#e6d3a3';
  ctx.strokeRect(60, 60, w - 120, h - 120);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 12;
  ctx.font = '700 64px "Playfair Display", serif';
  ctx.fillText(CONFIG.eventTitle, w / 2, h - 170);
  ctx.font = '500 38px Inter, sans-serif';
  ctx.fillText(CONFIG.eventDate, w / 2, h - 110);
  ctx.shadowBlur = 0;
}
function drawBlush(ctx, w, h) {
  ctx.fillStyle = '#f9d5dc';
  ctx.fillRect(0, 0, w, 70); ctx.fillRect(0, h - 70, w, 70);
  ctx.fillRect(0, 0, 70, h); ctx.fillRect(w - 70, 0, 70, h);
  const dots = [[40,40],[w-40,40],[40,h-40],[w-40,h-40],[w/2,35],[w/2,h-35],[35,h/2],[w-35,h/2]];
  dots.forEach(function (p) {
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      ctx.beginPath(); ctx.fillStyle = '#e88fa3';
      ctx.arc(p[0] + Math.cos(a) * 26, p[1] + Math.sin(a) * 26, 22, 0, 7); ctx.fill();
    }
    ctx.beginPath(); ctx.fillStyle = '#f6c453'; ctx.arc(p[0], p[1], 16, 0, 7); ctx.fill();
  });
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 12;
  ctx.font = '700 62px "Playfair Display", serif';
  ctx.fillText(CONFIG.eventTitle, w / 2, h - 150);
  ctx.font = '500 36px Inter, sans-serif';
  ctx.fillText(CONFIG.eventDate, w / 2, h - 100);
  ctx.shadowBlur = 0;
}
function drawNoir(ctx, w, h) {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, h - 300, w, 300);
  ctx.fillRect(0, 0, w, 40); ctx.fillRect(0, 0, 40, h); ctx.fillRect(w - 40, 0, 40, h);
  ctx.textAlign = 'center'; ctx.fillStyle = '#f5f0e6';
  ctx.font = '700 66px "Playfair Display", serif';
  ctx.fillText(CONFIG.eventTitle, w / 2, h - 160);
  ctx.fillStyle = '#c9a766'; ctx.font = '500 38px Inter, sans-serif';
  ctx.fillText(CONFIG.eventDate, w / 2, h - 95);
}

/* ====================== PROMPT 2: KOMPOSIT CANVAS ====================== */
const frameCache = {};
function loadImage(src) {
  return new Promise(function (res, rej) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function () { res(img); };
    img.onerror = function () { rej(new Error('Gagal memuat frame: ' + src)); };
    img.src = src;
  });
}
async function getFrameImage(frame) {
  if (frameCache[frame.id]) return frameCache[frame.id];
  let img;
  if (frame.src) {
    img = await loadImage(frame.src);
  } else {
    const c = document.createElement('canvas');
    c.width = CONFIG.canvasW; c.height = CONFIG.canvasH;
    frame.draw(c.getContext('2d'), c.width, c.height);
    img = await loadImage(c.toDataURL('image/png'));
  }
  frameCache[frame.id] = img;
  return img;
}

/** Gambar sumber (video/img) ke canvas dengan skala "cover" */
function drawCover(ctx, source, sw, sh, W, H, mirror) {
  const scale = Math.max(W / sw, H / sh);
  const dw = sw * scale, dh = sh * scale;
  const dx = (W - dw) / 2, dy = (H - dh) / 2;
  ctx.save();
  if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(source, dx, dy, dw, dh);
  ctx.restore();
}

/** Gabungkan foto + frame -> Blob JPEG */
async function compositePhoto(source, sw, sh, frame, mirror) {
  const canvas = document.getElementById('work');
  canvas.width = CONFIG.canvasW; canvas.height = CONFIG.canvasH;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawCover(ctx, source, sw, sh, canvas.width, canvas.height, mirror);
  const frameImg = await getFrameImage(frame);
  ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
  return new Promise(function (res, rej) {
    canvas.toBlob(function (b) { b ? res(b) : rej(new Error('Gagal membuat gambar')); }, 'image/jpeg', 0.92);
  });
}

/* ====================== PROMPT 3: UPLOAD CLOUDINARY ====================== */
async function uploadToCloudinary(blob) {
  try {
    const fd = new FormData();
    fd.append('file', blob);
    fd.append('upload_preset', CONFIG.uploadPreset);
    const r = await fetch('https://api.cloudinary.com/v1_1/' + CONFIG.cloudName + '/image/upload', {
      method: 'POST', body: fd
    });
    const data = await r.json();
    if (!r.ok || !data.secure_url) {
      throw new Error((data.error && data.error.message) || 'Upload gagal (' + r.status + ')');
    }
    return data.secure_url;
  } catch (err) {
    throw new Error('Upload ke Cloudinary gagal: ' + err.message);
  }
}

/* ====================== API GAS ====================== */
async function saveToSheet(payload) {
  // text/plain agar tidak memicu preflight CORS (GAS tidak mendukung OPTIONS)
  const r = await fetch(CONFIG.gasUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const data = await r.json();
  if (data.status !== 'success') throw new Error(data.message || 'Gagal menyimpan data');
  return data;
}
async function fetchGallery() {
  const r = await fetch(CONFIG.gasUrl);
  const data = await r.json();
  if (!Array.isArray(data)) throw new Error(data.message || 'Format data salah');
  return data;
}

/* ====================== UI LOGIC ====================== */
const $ = function (id) { return document.getElementById(id); };
let currentFacing = 'user', selectedFrame = null, stream = null, resultBlob = null, resultUrl = null, uploadedUrl = null;

$('title').textContent = CONFIG.eventTitle;
$('date').textContent = CONFIG.eventDate;

/* Batas jepretan per tamu (disimpan di browser perangkat) */
const SHOT_KEY = 'photobooth_shots_used';
function shotsUsed() {
  try { return parseInt(localStorage.getItem(SHOT_KEY) || '0', 10) || 0; } catch (e) { return 0; }
}
function useShot() {
  try { localStorage.setItem(SHOT_KEY, String(shotsUsed() + 1)); } catch (e) {}
}
function shotsLeft() { return Math.max(0, CONFIG.maxShots - shotsUsed()); }
function updateShotInfo() {
  const left = shotsLeft();
  const text = left > 0
    ? 'Sisa jepretan: ' + left + ' dari ' + CONFIG.maxShots
    : 'Jatah jepretan Anda sudah habis (' + CONFIG.maxShots + ' foto). Terima kasih!';
  $('shotInfo').textContent = text;
  $('shotInfo1').textContent = text;
  $('btnSnap').disabled = left <= 0;
  $('btnStartCam').disabled = !selectedFrame || left <= 0;
}
updateShotInfo();

function showStep(n) {
  [1, 2, 3, 4].forEach(function (i) { $('step' + i).classList.toggle('hidden', i !== n); });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function showTab(tab) {
  const isPhoto = tab === 'photo';
  $('pagePhoto').classList.toggle('hidden', !isPhoto);
  $('pageGallery').classList.toggle('hidden', isPhoto);
  $('tabPhoto').className = 'py-3 border-b-2 ' + (isPhoto ? 'border-amber-700 text-amber-800' : 'border-transparent text-stone-500');
  $('tabGallery').className = 'py-3 border-b-2 ' + (!isPhoto ? 'border-amber-700 text-amber-800' : 'border-transparent text-stone-500');
  if (!isPhoto) { stopCamera(); loadGallery(); }
}
$('tabPhoto').onclick = function () { showTab('photo'); };
$('tabGallery').onclick = function () { showTab('gallery'); };
$('btnToGallery').onclick = function () { showTab('gallery'); };

/* Step 1: daftar frame */
(async function renderFrames() {
  for (const f of FRAMES) {
    const btn = document.createElement('button');
    btn.className = 'frame-card rounded-xl overflow-hidden bg-stone-200 relative';
    btn.style.aspectRatio = '9/16';
    const img = document.createElement('img');
    img.className = 'absolute inset-0 w-full h-full'; img.alt = f.name;
    try { img.src = (await getFrameImage(f)).src; } catch (e) {}
    const label = document.createElement('span');
    label.className = 'absolute bottom-1 left-0 right-0 text-[10px] text-center bg-white/80 py-0.5';
    label.textContent = f.name;
    btn.append(img, label);
    btn.onclick = function () {
      selectedFrame = f;
      document.querySelectorAll('.frame-card').forEach(function (c) { c.classList.remove('selected'); });
      btn.classList.add('selected');
      updateShotInfo();
    };
    $('frameList').appendChild(btn);
  }
})();

/* Step 2: kamera */
async function startCamera() {
  $('camError').classList.add('hidden');
  try {
    stopCamera();
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: currentFacing }, width: { ideal: 1080 }, height: { ideal: 1920 } }, audio: false
    });
    $('video').srcObject = stream;
    // Cermin hanya untuk kamera depan (selfie)
    $('video').classList.toggle('mirror', currentFacing === 'user');
  } catch (err) {
    $('camError').textContent = 'Kamera tidak bisa dibuka. Pastikan izin kamera diberikan dan halaman dibuka lewat HTTPS. (' + err.message + ')';
    $('camError').classList.remove('hidden');
  }
}
function stopCamera() {
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
}
$('btnStartCam').onclick = async function () {
  if (!selectedFrame || shotsLeft() <= 0) return;
  $('liveFrame').src = (await getFrameImage(selectedFrame)).src;
  showStep(2);
  startCamera();
};
$('btnBack1').onclick = function () { stopCamera(); showStep(1); };
$('btnFlip').onclick = function () {
  currentFacing = currentFacing === 'user' ? 'environment' : 'user';
  startCamera();
};

$('btnSnap').onclick = async function () {
  const video = $('video');
  if (!stream || !video.videoWidth) return;
  if (shotsLeft() <= 0) { updateShotInfo(); alert('Jatah jepretan Anda sudah habis.'); return; }
  $('btnSnap').disabled = true;
  const cd = $('countdown');
  cd.classList.remove('hidden'); cd.classList.add('flex');
  for (let i = 3; i >= 1; i--) {
    cd.textContent = i;
    await new Promise(function (r) { setTimeout(r, 1000); });
  }
  cd.classList.add('hidden'); cd.classList.remove('flex');
  try {
    resultBlob = await compositePhoto(video, video.videoWidth, video.videoHeight, selectedFrame, currentFacing === 'user');
    useShot();
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = URL.createObjectURL(resultBlob);
    $('preview').src = resultUrl;
    stopCamera();
    $('uploadMsg').textContent = '';
    $('btnUpload').disabled = false;
    showStep(3);
  } catch (e) {
    alert(e.message);
  }
  $('btnSnap').disabled = false;
  updateShotInfo();
};

/* Step 3: unggah */
$('btnRetake').onclick = function () { showStep(2); startCamera(); };
$('btnUpload').onclick = async function () {
  const nama = $('inpNama').value.trim();
  const ucapan = $('inpUcapan').value.trim();
  const msg = $('uploadMsg');
  if (!nama) { msg.className = 'text-sm mt-3 text-center text-red-600'; msg.textContent = 'Mohon isi nama Anda.'; return; }
  $('btnUpload').disabled = true;
  msg.className = 'text-sm mt-3 text-center text-stone-600';
  try {
    if (!uploadedUrl) {
      msg.textContent = 'Mengunggah foto...';
      uploadedUrl = await uploadToCloudinary(resultBlob);
    }
    msg.textContent = 'Menyimpan pesan...';
    await saveToSheet({ nama: nama, ucapan: ucapan, imageUrl: uploadedUrl, timestamp: new Date().toISOString() });
    $('donePreview').src = resultUrl;
    showStep(4);
  } catch (e) {
    msg.className = 'text-sm mt-3 text-center text-red-600';
    msg.textContent = e.message;
    $('btnUpload').disabled = false;
  }
};

/* Step 4 */
$('btnDownload').onclick = function () {
  const a = document.createElement('a');
  a.href = resultUrl; a.download = 'photobooth-' + Date.now() + '.jpg';
  document.body.appendChild(a); a.click(); a.remove();
};
$('btnAgain').onclick = function () {
  uploadedUrl = null; resultBlob = null;
  $('inpNama').value = ''; $('inpUcapan').value = '';
  showStep(1);
};

/* Galeri */
function downloadUrl(url) {
  return url.replace('/upload/', '/upload/fl_attachment/');
}
async function loadGallery() {
  const grid = $('galleryGrid'), msg = $('galleryMsg');
  grid.innerHTML = ''; msg.textContent = 'Memuat...'; msg.classList.remove('hidden');
  try {
    const items = (await fetchGallery()).reverse();
    if (!items.length) { msg.textContent = 'Belum ada foto. Jadilah yang pertama!'; return; }
    msg.classList.add('hidden');
    items.forEach(function (it) {
      const url = it.Image_URL;
      const card = document.createElement('button');
      card.className = 'bg-white rounded-xl overflow-hidden shadow text-left';
      const img = document.createElement('img');
      img.src = String(url).replace('/upload/', '/upload/w_500,q_auto/');
      img.loading = 'lazy'; img.alt = 'Foto ' + it.Nama;
      img.className = 'w-full bg-stone-200'; img.style.aspectRatio = '9/16';
      const cap = document.createElement('div');
      cap.className = 'px-2 py-1.5 text-xs font-semibold truncate';
      cap.textContent = it.Nama;
      card.append(img, cap);
      card.onclick = function () {
        $('modalImg').src = url;
        $('modalName').textContent = it.Nama;
        $('modalMsg').textContent = it.Pesan_Ucapan || '';
        $('modalDownload').href = downloadUrl(url);
        $('modal').classList.remove('hidden'); $('modal').classList.add('flex');
      };
      grid.appendChild(card);
    });
  } catch (e) {
    msg.textContent = 'Gagal memuat galeri: ' + e.message;
  }
}
$('btnRefresh').onclick = loadGallery;
$('modalClose').onclick = function () { $('modal').classList.add('hidden'); $('modal').classList.remove('flex'); };
$('modal').onclick = function (e) { if (e.target === $('modal')) $('modalClose').onclick(); };
</script>
</body>
</html>
