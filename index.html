<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121210;
    --body-bg: #1c1a17;
    --panel: #2b2722;
    --border: #423c34;
    --ink: #f7f1e5;
    --muted: #a39685;
    --accent: #ff5e00;
    --accent-glow: rgba(255, 94, 0, 0.4);
    --yellow-led: #f4d03f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: 'Space Mono', monospace; }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 2px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, #ff5e00, #ffb07c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
  }

  .link {
    color: var(--accent);
    text-decoration: none;
    font-size: 11px;
    border: 1px solid var(--accent);
    padding: 6px 12px;
    border-radius: 99px;
    font-weight: 700;
    background: rgba(255, 94, 0, 0.05);
    transition: all 0.2s;
  }
  .link:active { background: var(--accent); color: #000; }

  /* Body Kamera Gaya Y2K Retro */
  .camera {
    background: linear-gradient(145deg, #2d2924, #1a1815);
    border-radius: 28px;
    padding: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
    border: 1px solid var(--border);
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    padding: 0 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .rec-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--yellow-led);
  }
  .rec-dot {
    width: 8px;
    height: 8px;
    background: var(--yellow-led);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--yellow-led);
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .counter {
    background: #090908;
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 700;
    border: 1px solid #332d26;
  }

  .viewfinder {
    position: relative;
    aspect-ratio: 3/4;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    border: 3px solid #090908;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
  }

  video, #preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #preview { position: absolute; inset: 0; display: none; }

  /* Efek Grain & Flash */
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.25; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence baseFrequency='.8' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.7'/></svg>");
  }
  .flash {
    position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .flash.on { opacity: 1; transition: none; }

  /* Filter Slider */
  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 14px 2px 4px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filters button {
    flex: 0 0 auto;
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 7px 14px;
    font: inherit;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s;
  }
  .filters button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  /* Tombol Kontrol Utama */
  .controls {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 16px 0 4px;
  }

  .small {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--ink);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .small:active { transform: scale(0.92); }
  .small.active-flash { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

  .shutter {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: 4px solid #38322c;
    background: radial-gradient(circle at 35% 30%, #ff8a55, var(--accent) 60%, #b84102);
    box-shadow: 0 6px 0 #6e2501, 0 10px 20px rgba(255,94,0,0.3);
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .shutter:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #6e2501, 0 5px 10px rgba(255,94,0,0.2);
  }

  .actions { display: none; gap: 10px; margin-top: 4px; }
  .actions button {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .retake { background: var(--panel); color: var(--muted); border: 1px solid var(--border); }
  .save { background: var(--accent); color: #fff; box-shadow: 0 4px 15px var(--accent-glow); }

  .status {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    min-height: 16px;
    letter-spacing: 0.5px;
  }

  /* Modal Input Nama Tamu */
  .modal {
    position: fixed; inset: 0; background: rgba(10,10,9,0.85); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 9;
  }
  .card {
    background: var(--body-bg);
    padding: 24px;
    border-radius: 20px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
  }
  .card h2 { font-family: 'Syne', sans-serif; font-size: 20px; color: var(--ink); margin-bottom: 6px; }
  .card p { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .card input {
    width: 100%; margin-bottom: 16px; padding: 12px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: #121210; color: var(--ink); font: inherit; outline: none;
  }
  .card input:focus { border-color: var(--accent); }
  .card button {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 15px var(--accent-glow);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>CyberDisposable</h1>
    <a class="link" href="gallery.html">Galeri →</a>
  </header>

  <div class="camera">
    <div class="topbar">
      <div class="rec-indicator"><div class="rec-dot"></div><span>RETRO CAM</span></div>
      <span class="counter" id="counter">SISA: --/--</span>
    </div>
    <div class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <img id="preview" alt="preview">
      <div class="grain" id="grain"></div>
      <div class="flash" id="flash"></div>
    </div>
    
    <!-- Filter Pilihan Estetik -->
    <div class="filters" id="filters"></div>

    <div class="controls" id="controls">
      <button class="small" id="flipBtn" title="Putar Kamera">⟲</button>
      <button class="small" id="flashBtn" title="Lampu Flash Senter">⚡</button>
      <button class="shutter" id="shutter" title="Jepret Foto"></button>
      <a class="small" href="gallery.html" style="text-decoration:none; display:flex; align-items:center; justify-content:center;" title="Buka Galeri">▦</a>
    </div>

    <div class="actions" id="actions">
      <button class="retake" id="retake">Ulangi</button>
      <button class="save" id="save">Simpan & Upload</button>
    </div>
  </div>
  <div class="status" id="status"></div>
</div>

<!-- Modal Masuk Nama Tamu -->
<div class="modal" id="nameModal" style="display:none">
  <div class="card">
    <h2>Selamat Datang!</h2>
    <p>Masukkan nama atau panggilan kamu sebelum mulai memotret 📸</p>
    <input id="nameInput" placeholder="Contoh: Rian & Partner" maxlength="40">
    <button id="nameBtn">Mulai Kamera</button>
  </div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
// Masukkan URL Web App Google Apps Script Anda di sini
const API_URL = "MASUKKAN_URL_WEB_APP_APPS_SCRIPT_ANDA_DISINI";

const CFG = {
  max: 15,
  cloud: "rfth8pyv",
  preset: "disposable-camera"
};

// Variasi Filter Estetik Y2K / Retro
const FILTERS = {
  normal:  { label:'Normal',     css:'none', grain:0.15 },
  vintage: { label:'90s Warm',   css:'sepia(0.3) saturate(1.4) contrast(1.1)', grain:0.25 },
  cyber:   { label:'Cyber Punk', css:'contrast(1.3) saturate(1.5) hue-rotate(-15deg)', grain:0.3 },
  bw:      { label:'Retro Mono', css:'grayscale(1) contrast(1.35) brightness(1.05)', grain:0.35 },
  lofi:    { label:'Toy Lofi',   css:'contrast(1.4) saturate(1.2) brightness(0.95)', grain:0.45 }
};

const $ = id => document.getElementById(id);
let current = 'normal', facing = 'environment', stream = null, blob = null, used = 0, busy = false, torchOn = false;

let guestId = localStorage.getItem('ddc_gid');
if (!guestId) { 
  guestId = 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); 
  localStorage.setItem('ddc_gid', guestId); 
}
let guestName = localStorage.getItem('ddc_name');

function updateCounter(){
  const rem = Math.max(0, CFG.max - used);
  $('counter').textContent = 'SISA: ' + rem + '/' + CFG.max;
  $('shutter').disabled = rem <= 0;
}
function status(t){ $('status').textContent = t; }

// Render Pilihan Filter
Object.entries(FILTERS).forEach(([k,f])=>{
  const b = document.createElement('button');
  b.textContent = f.label; b.dataset.k = k;
  if (k===current) b.className='active';
  b.onclick = ()=>{ 
    current=k; 
    document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x.dataset.k===k)); 
    applyFilter(); 
  };
  $('filters').appendChild(b);
});

function applyFilter(){
  $('video').style.filter = FILTERS[current].css;
  $('grain').style.opacity = FILTERS[current].grain;
}

// Inisialisasi Kamera & Senter (Torch)
async function startCamera(){
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: facing }, 
      audio: false 
    });
    const videoElement = $('video');
    videoElement.srcObject = stream;
    await videoElement.play();
    videoElement.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
    status('');
  } catch(e) {
    status('Gagal membuka kamera. Periksa izin kamera browser.');
    console.error("Camera error:", e);
  }
}

// Tombol Putar Kamera Depan/Belakang
$('flipBtn').onclick = ()=>{ 
  facing = facing === 'user' ? 'environment' : 'user'; 
  torchOn = false;
  $('flashBtn').classList.remove('active-flash');
  startCamera(); 
};

// Tombol Kontrol Flash Fisik (Senter Malam Hari)
$('flashBtn').onclick = async () => {
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  const capabilities = track.getCapabilities ? track.getCapabilities() : {};
  
  if (!capabilities.torch) {
    alert('Maaf, perangkat atau kamera ini tidak mendukung fitur lampu flash fisik.');
    return;
  }

  try {
    torchOn = !torchOn;
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    $('flashBtn').classList.toggle('active-flash', torchOn);
  } catch (err) {
    console.error('Gagal mengaktifkan flash:', err);
    status('Flash gagal dinyalakan di perangkat ini.');
  }
};

// Efek Suara Kamera Shutter (Audio Sintetis via Web Audio API)
function playShutterSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(120, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.08);
  } catch(e) {}
}

// Tombol Jepret (Shutter)
$('shutter').onclick = ()=>{
  if (used >= CFG.max) return;
  const v = $('video'); 
  if (!v.videoWidth) return;
  
  playShutterSound();
  $('flash').classList.add('on'); 
  setTimeout(()=>$('flash').classList.remove('on'), 80);
  
  const c = $('canvas'), ctx = c.getContext('2d');
  const w = v.videoWidth, h = v.videoHeight;
  const sz = Math.min(w, h);
  c.width = 1000; c.height = 1000;
  
  ctx.save();
  if (facing === 'user'){ ctx.translate(c.width, 0); ctx.scale(-1, 1); }
  ctx.filter = FILTERS[current].css;
  ctx.drawImage(v, (w-sz)/2, (h-sz)/2, sz, sz, 0, 0, c.width, c.height);
  ctx.restore(); 
  ctx.filter = 'none';
  
  // Watermark Tanggal Khas Kamera Retro
  addDateStamp(ctx, c.width, c.height);
  
  c.toBlob(b=>{ 
    blob = b; 
    $('preview').src = URL.createObjectURL(b); 
    $('preview').style.display = 'block';
    $('controls').style.display = 'none'; 
    $('actions').style.display = 'flex'; 
    $('filters').style.visibility = 'hidden'; 
  }, 'image/jpeg', 0.92);
};

function addDateStamp(ctx,w,h){
  const d = new Date();
  const t = "'" + String(d.getFullYear()).slice(2) + ' ' + (d.getMonth()+1) + ' ' + d.getDate();
  ctx.font = 'bold 42px "Space Mono", monospace'; 
  ctx.fillStyle = '#ff7b3d';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 4;
  ctx.textAlign = 'right'; 
  ctx.fillText(t, w-40, h-40);
}

function resetView(){
  blob = null; 
  $('preview').style.display = 'none';
  $('controls').style.display = 'flex'; 
  $('actions').style.display = 'none'; 
  $('filters').style.visibility = 'visible';
}
$('retake').onclick = resetView;

// Tombol Simpan & Upload ke Cloudinary + GAS
$('save').onclick = async ()=>{
  if (!blob || busy) return; 
  busy = true; 
  $('save').disabled = true; 
  status('Mengunggah ke rol film...');
  
  try {
    const fd = new FormData();
    fd.append('file', blob); 
    fd.append('upload_preset', CFG.preset);
    fd.append('folder', 'disposable-camera'); 
    fd.append('tags', guestId);
    
    const r = await fetch('https://api.cloudinary.com/v1_1/' + CFG.cloud + '/image/upload', { 
      method: 'POST', 
      body: fd 
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error ? j.error.message : 'Gagal upload ke Cloudinary');
    
    const queryParams = new URLSearchParams({
      action: 'save',
      guestId: guestId,
      guestName: guestName,
      filter: current,
      imageUrl: j.secure_url,
      publicId: j.public_id,
      width: j.width,
      height: j.height
    });

    await fetch(API_URL + '?' + queryParams.toString(), { method: 'GET', mode: 'no-cors' });
    
    busy = false; 
    $('save').disabled = false;
    used++; 
    localStorage.setItem('ddc_used', used); 
    updateCounter(); 
    resetView();
    status('Berhasil disimpan ke galeri! ✓');
  } catch(e){ 
    busy = false; 
    $('save').disabled = false; 
    status('Error: ' + e.message); 
  }
};

used = Number(localStorage.getItem('ddc_used') || 0); 
updateCounter(); 
applyFilter();

if (!guestName){ 
  $('nameModal').style.display = 'flex'; 
}
$('nameBtn').onclick = ()=>{ 
  guestName = $('nameInput').value.trim() || 'Tamu Kehormatan'; 
  localStorage.setItem('ddc_name', guestName); 
  $('nameModal').style.display = 'none'; 
  startCamera();
};

if (guestName) {
  startCamera();
}
</script>
</body>
</html>
