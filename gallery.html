<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fraunces:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0d0c;--panel:#1b1917;--ink:#f3ead8;--muted:#9a9082;--accent:#ff6b2c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Space Mono',monospace;min-height:100vh}
  header{position:sticky;top:0;z-index:5;background:#0e0d0ce6;backdrop-filter:blur(10px);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2622}
  h1{font-family:'Fraunces',serif;font-style:italic;font-size:24px}
  .meta{font-size:11px;color:var(--muted);margin-top:2px}
  .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
  .link{color:var(--accent);text-decoration:none;font-size:12px;border:1px solid var(--accent);padding:8px 12px;border-radius:999px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:20px;max-width:1400px;margin:0 auto}
  .print{background:#f4efe4;padding:8px 8px 30px;border-radius:3px;box-shadow:0 8px 20px #0009;position:relative}
  .print img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#222}
  .print span{position:absolute;bottom:7px;left:10px;right:10px;color:#3a332a;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{text-align:center;color:var(--muted);padding:80px 20px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Our Wedding Day</h1>
    <div class="meta"><span class="live"></span><span id="count">Memuat...</span></div>
  </div>
  <a class="link" href="index.html">← Kamera</a>
</header>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">Belum ada foto. Jadilah yang pertama! 📸</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxKnYCnCti182YUxdgamGC__6xbqbe0ngxT9c-XIlNn1NbDp7m1jhGBwhMXW4TP0Co/exec";

const grid = document.getElementById('grid');
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function load(){
  try {
    const res = await fetch(API_URL);
    const text = await res.text();
    const data = JSON.parse(text);
    
    document.getElementById('count').textContent = data.total + ' foto · live';
    document.getElementById('empty').style.display = data.total ? 'none' : 'block';
    
    grid.innerHTML = data.photos.map(p =>
      '<div class="print"><img loading="lazy" src="'+esc(p.thumb)+'" alt=""><span>'+esc(p.guestName)+'</span></div>'
    ).join('');
  } catch(e) {
    document.getElementById('count').textContent = 'Gagal memuat';
    console.error(e);
  }
}
load();
setInterval(load, 10000);
</script>
</body>
</html>
